# Catalog of every slide deck published under teaching/<course>/.
#
# The course index pages render their deck lists from this file through
# _includes/deck-lists.html, so a deck is described in exactly one place
# instead of being retyped into four near-identical hand-maintained lists.
# tests/content/test_deck_catalog.py keeps this file and the directories on
# disk in lockstep: every deck directory must be listed here, every entry
# must point at a directory that exists, and `source` must match what is
# actually in that directory.
#
# Fields per deck:
#   dir     directory name under teaching/<course>/<section>/
#   label   short position name shown in bold, e.g. "Lecture 05"
#   title   what the deck actually covers, read off its own content
#   source  "slides"  a teaching/**/slides.md Marp source; the build renders
#                     index.html and index.pdf and copies slides.md alongside
#                     them, so all three formats are linked
#           "legacy"  no source, only the index.html and index.pdf committed
#                     before the render pipeline existed (see CONTRIBUTING.md)
#
# Titles here are descriptive, not aspirational: a deck is named for the
# material it contains. Where that disagrees with the course it sits in, the
# index makes the mismatch visible rather than hiding it behind a placeholder.

# Section directory names, in the order the course pages present them, paired
# with the heading each one gets.
sections:
  - dir: lectures
    heading: Lecture Slides
  - dir: laboratories
    heading: Laboratories
  - dir: assignments
    heading: Assignments

