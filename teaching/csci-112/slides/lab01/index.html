</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" lang="POSIX">
<h1 id="positional-notation-1">Positional notation</h1>
<div class = "justify lh-15">
<ul>
<li>Usually means the extension to any base (2, …, 8,10,16 etc.) of the Hindu–Arabic numeral system (or decimal system).</li>
<li>A positional system is a numeral system in which the contribution of a digit to the value of a number is the value of the digit multiplied by a factor determined by the position of the digit.</li>
<li>In modern positional systems, such as the decimal system, the position of the digit means that its value must be multiplied by some value: in 444, the three identical symbols represent four hundreds, four tens, and four units, respectively, due to their different positions in the digit string.</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" lang="POSIX">
<h1 id="base-of-the-numeral-system-base">Base of the numeral system <img src="base.png" alt="base" /></h1>
<div class = "justify lh-20">
<ul>
<li>In mathematical numeral systems the radix r is usually the number of unique digits, including zero, that a positional numeral system uses to represent numbers.</li>
<li>The highest symbol of a positional numeral system usually has the value one less than the value of the radix of that numeral system. The standard positional numeral systems differ from one another only in the base they use.</li>
<li>The radix is an integer that is greater than 1, since a radix of zero would not have any digits, and a radix of 1 would only have the zero digit.</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" lang="POSIX">

<h1 id="converting-decimal-numbers-to-binary">Converting decimal numbers to binary</h1>
<h2 id="steps">Steps:</h2>
<div class = "justify lh-20">
<ol>
<li>Divide the decimal number by 2. The remainder of the division will be either 0 or 1.</li>
<li>If the remainder is 0, write down a 0.</li>
<li>If the remainder is 1, write down a 1.</li>
<li>Repeat steps 2 and 3 until the decimal number is 0.</li>
<li>Read the numbers <strong>from bottom to top</strong> to get the binary number.</li>
</ol>
</div>
</section>

<h1 id="data-in-a-computer">Data in a computer</h1>
<h2 id="can-essentially-be-stored-using-two-standards">can essentially be stored using two standards:</h2>
<ol>
<li>
<p>integers represented in binary,</p>
</li>
<li>
<p>real (floating-point) numbers stored according to the IEEE 754 standard.</p>
</li>
</ol>
<p>Everything else is a combination or interpretation based on these two fundamental forms of representation.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" lang="POSIX">
<h1 id="summary">Summary</h1>
<p>This archive provides a pre-configured, lightweight MinGW (Minimalist GNU for Windows) environment tailored for compiling and building C and C++ programs directly from the command line or via Makefile scripts.</p>
<h2 id="what-is-mingw">What is MinGW?</h2>
<p>MinGW is a minimalist development environment for native Microsoft Windows applications. It provides a complete open-source programming toolchain that allows you to use standard GNU utilities on Windows.</p>
<h3 id="included-toolchain-32-bit">Included Toolchain (32-bit)</h3>
<p>GCC / G++: The GNU C and C++ compilers required to translate your source code into executable binaries.<br />
GNU Make: Build automation tool used to execute Makefile instructions and manage project dependencies efficiently.<br />
Architecture: 32-bit version, ensuring high compatibility and lightweight performance for classroom environments.</p>
<h2 id="installation-directory-structure">Installation Directory Structure</h2>
<p><strong>To ensure everything works smoothly, extract the downloaded archive so that the folder structure looks exactly like this on your main drive:</strong></p>
<p><code>C:\MinGW\bin\</code></p>
<p>(Make sure the path to the executable binaries ends up being <code>C:\MinGW\bin</code>).</p>
<p>Quick PATH Configuration (PowerShell)</p>
<p>The easiest way to make the compiler globally recognized by your system is to add it to your user PATH.</p>
<ol>
<li>
<p>Copy the PowerShell script below to your clipboard:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell"><span class="hljs-variable">$path</span> = [<span class="hljs-type">System.Environment</span>]::GetEnvironmentVariable(<span class="hljs-string">&quot;PATH&quot;</span>, <span class="hljs-string">&quot;User&quot;</span>)
<span class="hljs-keyword">if</span> (<span class="hljs-operator">-not</span> (<span class="hljs-variable">$path</span> <span class="hljs-operator">-like</span> <span class="hljs-string">&quot;*C:\mingw\bin*&quot;</span>)) {
    [<span class="hljs-type">System.Environment</span>]::SetEnvironmentVariable(<span class="hljs-string">&quot;PATH&quot;</span>, <span class="hljs-string">&quot;C:\mingw\bin;<span class="hljs-variable">$path</span>&quot;</span>, <span class="hljs-string">&quot;User&quot;</span>)
    <span class="hljs-built_in">Write-Host</span> <span class="hljs-string">&quot;Added C:\mingw\bin to PATH.&quot;</span>
} <span class="hljs-keyword">else</span> {
    <span class="hljs-built_in">Write-Host</span> <span class="hljs-string">&quot;The path is already in PATH.&quot;</span>
}
</code></pre>
</li>
<li>
<p>Open PowerShell on your computer.</p>
</li>
<li>
<p>Paste the script and press Enter.</p>
</li>
<li>
<p>Restart your terminal or VS Code, and gcc / make will be fully ready to use!</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" lang="POSIX">
<h1 id="summary-1">Summary</h1>
<p>Environment Setup &amp; Build Basics<br />
Welcome to the starter project! This is a minimalist C project designed to help you get familiar with Visual Studio Code, manual compilation, and basic build tools.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Project Structure
│   compile.bat        # Quick script for manual command-line compilation
│   main.c             # Simple starting C source code
│   Makefile           # Standard build automation script
│
└───.vscode
        launch.json    # Debugger configuration
        settings.json  # Editor workspace settings
        tasks.json     # Build tasks integration for VS Code
</code></pre>
<h2 id="prerequisites-required">Prerequisites (Required)</h2>
<p>Before opening this project, ensure you have the following installed on your system:</p>
<ul>
<li>Visual Studio Code (VS Code) – Installed and ready.</li>
<li>MinGW (GCC compiler for Windows)</li>
<li>Crucial Step: Add the path to your MinGW bin directory (e.g., <code>C:\MinGW\bin</code>) to your system's Environment Variables (PATH) so that gcc and make commands are globally accessible in your terminal.</li>
</ul>
<h2 id="getting-started">Getting Started:</h2>
<ul>
<li>Download and extract the project archive (.zip) to your workspace folder.</li>
<li>Open the extracted folder in Visual Studio Code.</li>
<li>Explore the files and follow along with the lab instructions to test building via CLI, compile.bat, and the Makefile.</li>
</ul>
</section>
