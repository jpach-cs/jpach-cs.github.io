" font-weight="700" font-size="24" transform="translate(848.401 188)">Description</text><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(415.133 188)">Name</text><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="24" transform="translate(141.065 188)">Shape</text><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 253)">Shows the process's order of operation. A line coming from one</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 282)">symbol and pointing at another.</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(325.897 268)">Flowline/</text></g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(419.717 268)">Arrowhead</text><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 332)">Indicates the beginning and ending of a program or sub</text></g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(1150.72 332)">-</text><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 361)">process.</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(325.897 347)">Terminal</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 412)">Represents a set of operations that changes value, form, or</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 441)">location of data.</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(325.897 426)">Process</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 491)">Shows a conditional operation that determines which one of</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 520)">the two paths the program will take.</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(325.897 505)">Decision</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(588.736 584)">Indicates the process of inputting and outputting data.</text></g><g><text font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="24" transform="translate(325.897 584)">Input/Output</text></g><rect x="109" y="389" width="148" height="58" stroke="#000000" stroke-width="4" stroke-miterlimit="8" fill="none"/><path d="M147 495 183 465 219 495 183 525Z" stroke="#000000" stroke-width="4" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><path d="M109 605 138.6 544 257 544 227.4 605Z" stroke="#000000" stroke-width="4" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><path d="M132.81 310 233.19 310C246.34 310 257 323.208 257 339.5 257 355.792 246.34 369 233.19 369L132.81 369C119.66 369 109 355.792 109 339.5 109 323.208 119.66 310 132.81 310Z" stroke="#000000" stroke-width="4" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><path d="M109 257 246.526 257 246.526 261 109 261ZM244.526 253 256.526 259 244.526 265Z"/></g></svg>